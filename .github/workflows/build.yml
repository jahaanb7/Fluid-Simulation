name: Cross-OS Build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # ── FIX 1: fetch submodules so git doesn't exit 128 ─────────────────
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Linux: full set of GLFW X11/Wayland headers ─────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev

      # ── FIX 3: Ninja on macOS (not pre-installed) ───────────────────────
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # ── Windows: Ninja + put MSVC compiler on PATH ──────────────────────
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install ninja --yes

      # ── FIX 2: MSVC dev environment (cl.exe, link.exe) ──────────────────
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ── Configure ────────────────────────────────────────────────────────
      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGLFW_BUILD_WAYLAND=OFF

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel 2

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidSimulation-${{ matrix.os }}
          path: |
            build/FluidSimulation
            build/FluidSimulation.exe
            build/Release/FluidSimulation.exe
          if-no-files-found: warn